[build-system]
build-backend = "hatchling.build"

requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "waxmorph"
version = "0.1.0"
description = "Differentiable morphogenesis and shape-assembly on NVIDIA Warp."
readme = "README.md"
keywords = [ "biology", "gnn", "morphogenesis", "shape-assembly", "simulation", "warp" ]
license = "MIT"
authors = [
  { name = "WaxMorph Contributors" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
]

optional-dependencies.all = [
  "waxmorph[simulation,learning,docs,dev]",
]
optional-dependencies.dev = [
  "black>=26",
  "pre-commit>=4",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.9",
  "twine>=6",
]
optional-dependencies.docs = [
  "myst-nb>=1.1",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints>=2.3",
  "sphinx-book-theme>=1.1",
  "sphinxcontrib-bibtex>=2.6",
]
optional-dependencies.learning = [
  "geomloss>=0.2.6",
  "pykeops>=2.1",
  "torch>=2",
]
# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------
optional-dependencies.simulation = [
  "hsluv>=5",
  "imageio>=2.34",
  "matplotlib>=3.8",
  "pyglet>=2",
  "pyvista>=0.44",
  "scipy>=1.11",
  "tqdm>=4.66",
  "trimesh>=4",
  "vtk>=9.3",
  "warp-lang>=1.5",
]
urls.Documentation = "https://waxmorph.readthedocs.io"
urls.Issues = "https://github.com/waxmorph/waxmorph/issues"
urls.Source = "https://github.com/waxmorph/waxmorph"

[tool.hatch.build.targets.wheel]
packages = [ "waxmorph" ]

[tool.hatch.envs.default]
installer = "uv"

[tool.hatch.envs.test]
dependencies = [
  "waxmorph[learning,simulation]",
  "pytest>=8.3",
  "pytest-cov>=6",
]

[tool.hatch.envs.test.scripts]
run = "pytest {args:tests}"
cov = "pytest --cov=waxmorph --cov-report=term-missing {args:tests}"

[tool.hatch.envs.docs]
dependencies = [
  "waxmorph[docs]",
]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build -M html docs docs/_build"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = [ "py310" ]
extend-exclude = '''
/(
    OLD
  | Output
  | Meshes
  | MeshStarts
  | docs/_build
)/
'''

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "docs/_build",
  "Meshes",
  "MeshStarts",
  "OLD",
  "Output",
]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
lint.select = [ "B", "E", "F", "I", "RUF", "SIM", "UP", "W" ]
lint.ignore = [ "E501" ]
lint.per-file-ignores."tests/*" = [ "SIM" ]
lint.per-file-ignores."tests/test_render.py" = [ "E402", "F841" ]
lint.per-file-ignores."waxmorph/__init__.py" = [ "RUF022" ]
lint.per-file-ignores."waxmorph/emulator.py" = [ "E741" ]
lint.per-file-ignores."waxmorph/simulator.py" = [ "E741", "RUF059" ]
lint.isort.known-first-party = [ "waxmorph" ]

[tool.pytest.ini_options]
addopts = "-q --cov=waxmorph --cov-report=term-missing --cov-report=xml"
testpaths = [ "tests" ]
filterwarnings = [
  "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = [ "waxmorph" ]

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.",
]

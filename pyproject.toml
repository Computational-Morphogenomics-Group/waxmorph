[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "waxmorph"
version = "0.1.0"
description = "Spheroids simulating biophysical phenomena, built on a differentiable spatial computing framework."
readme = "README.md"
keywords = [ "biology", "gnn", "morphogenesis", "shape-assembly", "simulation", "warp" ]
license = "MIT"
authors = [
  { name = "WaxMorph Contributors" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
]
optional-dependencies.all = [
  "waxmorph[dev,docs,jax,learning,simulation]",
]
optional-dependencies.dev = [
  "black>=26",
  "pre-commit>=4",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.15",
  "twine>=6",
]
optional-dependencies.docs = [
  "myst-nb>=1.1",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints>=2.3",
  "sphinx-book-theme>=1.1",
  "sphinx-design>=0.6",
  "sphinxcontrib-bibtex>=2.6",
]
optional-dependencies.jax = [
  "equinox>=0.11",
  "jax>=0.4.30",
  "optax>=0.2",
  "ott-jax>=0.4",
  "waxmorph[simulation]",
]
optional-dependencies.jax-cuda = [
  "jax[cuda12]>=0.4.30",
  "waxmorph[jax]",
]
optional-dependencies.learning = [
  "geomloss>=0.2.6",
  "pykeops>=2.1",
  "torch>=2",
  "waxmorph[simulation]",
]
# ---------------------------------------------------------------------------
# Simulation
# ---------------------------------------------------------------------------
optional-dependencies.simulation = [
  "hsluv>=5",
  "imageio>=2.34",
  "matplotlib>=3.8",
  "pyglet>=2",
  "pyvista>=0.44",
  "scipy>=1.11",
  "tqdm>=4.66",
  "trimesh>=4",
  "vtk>=9.3",
  "warp-lang>=1.5",
]
urls.Documentation = "https://waxmorph.readthedocs.io"
urls.Issues = "https://github.com/waxmorph/waxmorph/issues"
urls.Source = "https://github.com/waxmorph/waxmorph"

[tool.hatch]
build.targets.wheel.packages = [ "waxmorph" ]
envs.default.installer = "uv"
envs.docs.dependencies = [
  "waxmorph[docs,learning,simulation,jax]",
]
envs.docs.scripts.build = "sphinx-build -M html docs docs/_build"
envs.test.dependencies = [
  "pytest-cov>=6",
  "pytest>=8.3",
  "waxmorph[learning,simulation,jax]",
]
envs.test.scripts.cov = "pytest --cov=waxmorph --cov-report=term-missing {args:tests}"
envs.test.scripts.run = "pytest {args:tests}"

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
target-version = [ "py310" ]
line-length = 100
extend-exclude = """/(
    OLD
  | Output
  | Meshes
  | MeshStarts
  | docs/_build
)/
"""

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "docs/_build",
  "Meshes",
  "MeshStarts",
  "OLD",
  "Output",
]
# ---------------------------------------------------------------------------
# Ruff lint
# ---------------------------------------------------------------------------
lint.select = [ "B", "E", "F", "I", "RUF", "SIM", "UP", "W" ]
lint.ignore = [ "E501" ]
lint.per-file-ignores."tests/*" = [ "SIM" ]
lint.per-file-ignores."tests/test_render.py" = [ "E402", "F841" ]
lint.per-file-ignores."waxmorph/__init__.py" = [ "RUF022" ]
lint.per-file-ignores."waxmorph/emulator.py" = [ "E741" ]
lint.per-file-ignores."waxmorph/jax/__init__.py" = [ "RUF022" ]
lint.per-file-ignores."waxmorph/simulator.py" = [ "E741", "RUF059" ]
lint.isort.known-first-party = [ "waxmorph" ]

[tool.pyproject-fmt]
max_supported_python = "3.13"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-q --cov=waxmorph --cov-report=term-missing --cov-report=xml"
ini_options.filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.coverage]
# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
run.branch = true
run.source = [ "waxmorph" ]
report.exclude_lines = [
  "if __name__ == .__main__.",
  "if TYPE_CHECKING:",
  "pragma: no cover",
]
report.show_missing = true
report.skip_covered = true

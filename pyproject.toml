[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "waxmorph"
version = "0.1.0"
description = "Differentiable morphogenesis and shape-assembly on NVIDIA Warp."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "WaxMorph Contributors" },
]
keywords = ["morphogenesis", "simulation", "warp", "gnn", "biology", "shape-assembly"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
simulation = [
    "warp-lang>=1.5.0",
    "matplotlib>=3.8",
    "pyvista>=0.44",
    "vtk>=9.3",
    "imageio>=2.34",
    "tqdm>=4.66",
]
learning = [
    "torch>=2.0",
]
docs = [
    "sphinx>=8.1",
    "sphinx-book-theme>=1.1",
    "myst-nb>=1.1",
    "sphinx-autodoc-typehints>=2.3",
    "sphinxcontrib-bibtex>=2.6",
]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "twine>=6.0",
]
all = [
    "waxmorph[simulation,learning,docs,dev]",
]

[project.urls]
Documentation = "https://waxmorph.readthedocs.io"
Source = "https://github.com/waxmorph/waxmorph"
Issues = "https://github.com/waxmorph/waxmorph/issues"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["waxmorph"]

[tool.hatch.envs.default]
installer = "uv"

[tool.hatch.envs.test]
dependencies = [
    "pytest",
    "pytest-cov",
]

[tool.hatch.envs.test.scripts]
run = "pytest {args:tests}"
cov = "pytest --cov=waxmorph --cov-report=term-missing {args:tests}"

[tool.hatch.envs.docs]
dependencies = [
    "waxmorph[docs]",
]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build -M html docs docs/_build"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "OLD",
    "Output",
    "Meshes",
    "MeshStarts",
    "docs/_build",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["waxmorph"]

[tool.ruff.lint.per-file-ignores]
"waxmorph/simulator.py" = ["E741"]
"waxmorph/emulator.py" = ["E741"]
"tests/*" = ["SIM"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
addopts = "-q --cov=waxmorph --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["waxmorph"]

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
